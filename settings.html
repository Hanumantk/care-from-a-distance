<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Swaps the viewport to the design width on a portrait phone. Must run
     before first paint, so it is not deferred. -->
<script src="viewport.js"></script>
<title>Parent Health App — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" crossorigin="anonymous" />
<link rel="stylesheet" href="settings.css" />
</head>
<body>
  <!-- ── iPhone 16 device shell ──────────────────────────────── -->
  <div class="device">
    <div class="device__btn device__btn--action"></div>
    <div class="device__btn device__btn--volup"></div>
    <div class="device__btn device__btn--voldown"></div>
    <div class="device__btn device__btn--power"></div>

    <div class="device__screen">

  <!-- iPhone 16 - 4 · canvas 393 x 816 above the tab bar -->
  <div class="screen" data-node-id="4:422">

   <div class="screen__scroll">
    <div class="screen__canvas">

    <h1 class="set-title" data-node-id="4:423">Settings</h1>

    <!-- ── Caretakers ───────────────────────────────────────── -->
    <section class="carers" data-node-id="4:572">
      <div class="carer carer--active" data-node-id="4:604">
        <img class="carer__avatar" src="assets/set-avatar-blue.svg" alt="" data-node-id="4:579" />
        <p class="carer__name" data-node-id="4:574">Hanu</p>
        <p class="carer__role" data-node-id="4:575">Caretaker 1 for leela</p>
        <div class="carer__heart-slot" data-node-id="4:594"></div>
      </div>

      <img class="carers__divider" src="assets/set-line305.svg" alt="" data-node-id="4:588" />

      <img class="carer__avatar carer__avatar--2" src="assets/set-avatar.svg" alt="" data-node-id="4:601" />
      <p class="carer__name carer__name--2" data-node-id="4:599">Abhishek</p>
      <p class="carer__role carer__role--2" data-node-id="4:600">Caretaker 2 for leela</p>
      <img class="carers__add" src="assets/set-add.svg" alt="" data-node-id="4:605" />
    </section>

    <!-- ── Setting rows ─────────────────────────────────────── -->
    <a class="set-row set-row--1" href="#" data-node-id="4:610">
      <img class="set-row__icon" src="assets/set-layout.svg" alt="" data-node-id="4:633" />
      <span class="set-row__label" data-node-id="4:611">Home preferences</span>
      <img class="set-row__chevron" src="assets/set-chevron.svg" alt="" data-node-id="4:645" />
    </a>

    <a class="set-row set-row--2" href="#" data-node-id="4:623">
      <img class="set-row__icon" src="assets/set-notepencil.svg" alt="" data-node-id="4:637" />
      <span class="set-row__label" data-node-id="4:624">Reminders</span>
      <img class="set-row__chevron" src="assets/set-chevron.svg" alt="" data-node-id="4:646" />
    </a>

    <a class="set-row set-row--3" href="#" data-node-id="4:625">
      <img class="set-row__icon" src="assets/set-bell.svg" alt="" data-node-id="4:635" />
      <span class="set-row__label" data-node-id="4:626">Notifications</span>
      <img class="set-row__chevron" src="assets/set-chevron.svg" alt="" data-node-id="4:647" />
    </a>

    <a class="set-row set-row--4" href="#" data-node-id="4:627">
      <img class="set-row__icon" src="assets/set-usercircle.svg" alt="" data-node-id="4:639" />
      <span class="set-row__label set-row__label--wide" data-node-id="4:628">Helper preferences</span>
      <img class="set-row__chevron" src="assets/set-chevron.svg" alt="" data-node-id="4:648" />
    </a>

    <a class="set-row set-row--5" href="#" data-node-id="4:629">
      <img class="set-row__icon" src="assets/set-wallet.svg" alt="" data-node-id="4:641" />
      <span class="set-row__label set-row__label--wide" data-node-id="4:630">Payments</span>
      <img class="set-row__chevron" src="assets/set-chevron.svg" alt="" data-node-id="4:649" />
    </a>

    <a class="set-row set-row--6" href="#" data-node-id="4:631">
      <img class="set-row__icon" src="assets/set-sliders.svg" alt="" data-node-id="4:643" />
      <span class="set-row__label set-row__label--wide" data-node-id="4:632">Account settings</span>
      <img class="set-row__chevron" src="assets/set-chevron.svg" alt="" data-node-id="4:650" />
    </a>

    </div><!-- /.screen__canvas -->
   </div><!-- /.screen__scroll -->

    <!-- Tab bar — "Navigation bar settings selected" (4:802) -->
    <nav class="tabbar" data-node-id="4:802">
      <a class="tabbar__item tabbar__item--home" href="index.html" data-node-id="4:807">
        <img class="tabbar__icon" src="assets/nav5-home.svg" alt="" />
        <span class="tabbar__label" data-node-id="4:803">Home</span>
      </a>
      <a class="tabbar__item tabbar__item--visits" href="visits.html" data-node-id="4:792">
        <img class="tabbar__icon" src="assets/nav5-visits.svg" alt="" />
        <span class="tabbar__label" data-node-id="4:804">Visits</span>
      </a>
      <a class="tabbar__item tabbar__item--medicine" href="medicine.html" data-node-id="4:811">
        <img class="tabbar__icon" src="assets/nav5-medicine.svg" alt="" />
        <span class="tabbar__label" data-node-id="4:806">Medicine</span>
      </a>
      <a class="tabbar__item tabbar__item--settings is-active" href="#" data-node-id="4:757">
        <img class="tabbar__icon" src="assets/nav5-settings.svg" alt="" />
        <span class="tabbar__label" data-node-id="4:805">Settings</span>
      </a>
    </nav>

  </div><!-- /.screen -->

      <!-- ── iOS chrome ─────────────────────────────────────── -->
      <div class="statusbar" aria-hidden="true">
        <span class="statusbar__time">8:12</span>
        <span class="statusbar__icons">
          <svg class="statusbar__icon" viewBox="0 0 17 12" fill="currentColor">
            <rect x="0"    y="8"   width="3" height="4"  rx="1" />
            <rect x="4.7"  y="5.5" width="3" height="6.5" rx="1" />
            <rect x="9.4"  y="3"   width="3" height="9"  rx="1" />
            <rect x="14.1" y="0"   width="3" height="12" rx="1" />
          </svg>
          <svg class="statusbar__icon" viewBox="0 0 16 12">
            <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <path d="M1.2 4.3a10 10 0 0 1 13.6 0" />
              <path d="M3.9 7.1a6.4 6.4 0 0 1 8.2 0" />
            </g>
            <circle cx="8" cy="10.1" r="1.35" fill="currentColor" />
          </svg>
          <svg class="statusbar__icon statusbar__icon--battery" viewBox="0 0 27 13">
            <rect x="0.6" y="0.6" width="22.8" height="11.8" rx="3.6"
                  fill="none" stroke="currentColor" stroke-opacity="0.38" stroke-width="1.1" />
            <rect x="2.2" y="2.2" width="16.5" height="8.6" rx="2.1" fill="currentColor" />
            <path d="M25.2 4.6v3.8a2.4 2.4 0 0 0 0-3.8z" fill="currentColor" fill-opacity="0.4" />
          </svg>
        </span>
      </div>

      <div class="island" aria-hidden="true"></div>
      <div class="homebar" aria-hidden="true"></div>

    </div><!-- /.device__screen -->
  </div><!-- /.device -->
<!-- Screenshot button: a presenter tool, not part of the design. -->
<script src="snap.js" defer></script>
</body>
</html>
